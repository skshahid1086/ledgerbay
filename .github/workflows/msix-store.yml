name: MSIX (Microsoft Store)

# Builds an UNSIGNED .appx/.msix for Partner Center upload.
# Not a public GitHub Release asset — Store re-signs the package.
# Partner Center (committed defaults in package.json build.appx):
#   identityName SkSahid.Ledgerbay
#   publisher    CN=799D416F-D7A9-40FB-8174-601BA874AB3C
#   PFN          SkSahid.Ledgerbay_k3en84vjpw33r
#   Store ID     9P2S6F5QWN88
# Version form: 1.13.9.0 (setBuildNumber=false → last segment 0)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver without leading v (e.g. 1.13.9). MSIX becomes x.y.z.0"
        required: true
        default: "1.13.9"

permissions:
  contents: read

jobs:
  msix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Privacy + refuse keystores
        shell: bash
        run: |
          bash scripts/privacy-scan.sh .
          if find . -iname '*.jks' -o -iname '*.keystore' -o -iname 'keystore.properties' | grep -q .; then
            echo "keystore must not be in the repo" >&2; exit 1
          fi
          if [ -d personal ] || [ -f app/personal-seed.json ]; then
            echo "personal must not be in the repo" >&2; exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Resolve web dir
        id: meta
        shell: bash
        run: |
          echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          if [ -f app/index.html ]; then echo "web=app" >> "$GITHUB_OUTPUT"
          elif [ -f web/index.html ]; then echo "web=web" >> "$GITHUB_OUTPUT"
          else echo "No app/index.html" >&2; exit 1; fi

      - name: Install Pillow (Store tile PNGs)
        shell: bash
        run: python3 -m pip install --user pillow

      - name: Build AppX (unsigned)
        working-directory: desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          PYTHONUTF8: "1"
          BUILD_TARGETS: appx
          # Optional overrides — defaults are Partner Center values in write-package-json.py
          # MS_STORE_IDENTITY_NAME: SkSahid.Ledgerbay
          # MS_STORE_PUBLISHER: CN=799D416F-D7A9-40FB-8174-601BA874AB3C
        run: |
          npm ci || npm install
          bash scripts/build-all.sh "../${{ steps.meta.outputs.web }}" "${{ steps.meta.outputs.version }}" "Ledgerbay" "in.ledgerbay.app"
          mkdir -p ../msix-out
          cp -f dist/*.appx ../msix-out/ 2>/dev/null || true
          cp -f dist/*.msix ../msix-out/ 2>/dev/null || true
          ls -lah dist/ ../msix-out/

      - name: Validate AppxManifest identity (from package)
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          import zipfile, re, sys
          from pathlib import Path
          pkgs = list(Path("msix-out").glob("*.appx")) + list(Path("msix-out").glob("*.msix"))
          if not pkgs:
            print("No .appx/.msix in msix-out", file=sys.stderr)
            raise SystemExit(1)
          z = zipfile.ZipFile(pkgs[0])
          # AppxManifest.xml is at package root
          name = next(n for n in z.namelist() if n.lower().endswith("appxmanifest.xml"))
          xml = z.read(name).decode("utf-8", errors="replace")
          Path("msix-out/AppxManifest.xml").write_text(xml, encoding="utf-8")
          checks = {
            "Identity Name": r'Name="SkSahid\.Ledgerbay"',
            "Publisher": r"""Publisher=['\"]CN=799D416F-D7A9-40FB-8174-601BA874AB3C['\"]""",
            "Version 1.13.x.0-style": r'Version="\d+\.\d+\.\d+\.0"',
            "DisplayName": r'>Ledgerbay<',
          }
          # version input may differ — only require .0 revision
          ok = True
          for label, pat in checks.items():
            if re.search(pat, xml):
              print(f"OK  {label}")
            else:
              print(f"FAIL {label} / {pat}")
              ok = False
          if not ok:
            print(xml[:2000])
            sys.exit(1)
          print("AppxManifest OK")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: ledgerbay-msix-store
          path: |
            msix-out/*.appx
            msix-out/*.msix
            msix-out/AppxManifest.xml
          if-no-files-found: error
